name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test macOS
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Show Swift Version
      run: swift --version

    - name: Run Automated Tests
      run: swift test

    - name: Build Release App
      run: ./Scripts/build_app.sh
